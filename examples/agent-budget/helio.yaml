# Agent budget configuration
#
# Three named upstreams at their own doors (/mcp/compute, /mcp/market-data
# and /mcp/tools), one $50 session pot that every door draws down, with a
# break-glass approval when a call would cross it, and one rule that holds
# every run_job call for a human. See README.md for the walkthrough.
#
# Sections follow the canonical order from docs/configuration.md:
# upstreams, listen, policies, budgets, approval, audit, dashboard.

version: '1'

upstreams:
  - name: compute
    url: 'http://localhost:8080/mcp'
    transport: streamable-http
  - name: market-data
    url: 'http://localhost:8081/mcp'
    transport: streamable-http
  - name: tools
    url: 'http://localhost:8082/mcp'
    transport: streamable-http

listen:
  port: 3000
  host: '127.0.0.1'

policies:
  default: allow
  rules:
    # A write tool held for a human: the ticket shows the tool, the door,
    # this rule and the arguments. run_job declares no amount, so the
    # budget below never sees it.
    - name: approve-job-runs
      match:
        upstreams: [tools]
        tool: 'run_job'
      action: require_approval
      approval:
        channel: dashboard
        # To route the ticket to Slack instead, uncomment the slack
        # channel under approval.channels below and switch this to:
        # channel: slack
        timeout: '300s'

budgets:
  # One pot per session, drawn down by three tools on three doors. Each
  # contributor names the argument field that carries the amount.
  - name: coding-agent-run
    limit: 50
    currency: USD
    window: session # never replenishes on a timer; idle pots collect after 24h
    key: session
    on_exceed: require_approval # a breach raises a break-glass ticket
    approval:
      channel: dashboard
      # Same switch as the rule above: channel: slack
    contributors:
      - match:
          tool: 'top_up_compute'
          upstreams: [compute]
        field: '$.amount'
      - match:
          tool: 'get_prices'
          upstreams: [market-data]
        field: '$.amount'
      - match:
          tool: 'run_check'
          upstreams: [tools]
        field: '$.price'

approval:
  timeout: 300s
  # Budget tickets ignore default_on_timeout: they always fail closed.
  default_on_timeout: deny
  channels:
    - type: dashboard
    # - type: slack
    #   bot_token: '${HELIO_SLACK_BOT_TOKEN}'
    #   signing_secret: '${HELIO_SLACK_SIGNING_SECRET}'
    #   channel: '${HELIO_SLACK_CHANNEL}'

audit:
  storage: sqlite
  # Relative to the working directory, not to this file: start the example
  # from examples/agent-budget every time, or a restart opens a different,
  # empty database and the pot starts over.
  path: ./helio-audit.db
  retention: 90d
  include_responses: true

dashboard:
  enabled: true
  port: 3100
  # Required because a rule and a budget both require approval. Generate a
  # fresh secret with `openssl rand -hex 32` and put it in `.env` as
  # HELIO_DASHBOARD_SECRET (see `.env.example`). The variable may hold the
  # secret or the `sha256:` digest that `helio secret` prints.
  api_secret: '${HELIO_DASHBOARD_SECRET}'
