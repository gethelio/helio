name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# One run per tag. GitHub delivered the v0.15.0 tag push twice and started two
# Release runs in the same second (run 37053833825 was the twin); with this
# group the newer run takes the ref and the other is cancelled on whatever job
# it has reached. Publishers and the Docker push only start after ci, so a
# twin cancelled early has published and pushed nothing; one cancelled in
# docker may already have pushed, and the last push to finish owns the image
# tags. Never push the same tag again while a run is in progress, and do not
# add a workflow_dispatch on a tag ref to this file: either joins this group
# and cancels a release in flight.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-tag-on-main:
    name: Verify tag ancestry on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag commit is reachable from main
        run: |
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tag commit $GITHUB_SHA is not reachable from origin/main."
            exit 1
          fi

  ci:
    name: CI
    needs: verify-tag-on-main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python SDK + test dependencies
        run: pip install -e './packages/python-sdk[dev]'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: pnpm secrets:scan

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Build
        run: pnpm build

      - name: Verify bundled dashboard assets in proxy dist
        run: test -f packages/proxy/dist/dashboard-assets/index.html && test -d packages/proxy/dist/dashboard-assets/assets

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # After Test on purpose: a failure here reads as a performance
      # regression on an otherwise green tree. Exit 1 comes from the
      # one gate in packages/proxy/scripts/benchmark.ts (governed
      # overhead p99 < 5ms); the end-to-end numbers never fail it.
      - name: Benchmark
        run: pnpm --filter @gethelio/proxy benchmark

      # The report is written before the gate is evaluated, so a FAIL
      # still publishes its numbers. !cancelled() rather than always()
      # so a run superseded by the concurrency group does not start
      # this step; guarded so an earlier failure (no report on disk)
      # does not add a second red step.
      - name: Publish the benchmark report to the job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f docs/benchmark-results.md ]; then
            cat docs/benchmark-results.md >> "$GITHUB_STEP_SUMMARY"
          fi

  publish-npm:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/set-release-version.sh "$VERSION"

      - name: Publish @gethelio/proxy
        run: npm publish --access public
        working-directory: packages/proxy

  publish-pypi:
    name: Publish to PyPI
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build

      - name: Build distribution
        run: python -m build packages/python-sdk

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: packages/python-sdk/dist/
          skip-existing: true

  # Not in the `release` job's needs list on purpose: a registry failure
  # must never block the GitHub Release. The maintainer then publishes the
  # entry by hand from a clean checkout of the tag (the release runbook).
  publish-registry:
    name: Publish to MCP registry
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: mcp-registry
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Stamps packages/proxy/server.json too, so the entry's server and
      # package versions equal the npm version this run just published.
      - name: Set package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/set-release-version.sh "$VERSION"

      # The publisher is pinned by release URL and checksum: these two values
      # are the whole bump when a newer mcp-publisher is adopted, and
      # Dependabot does not see them. The registry's own snippet pulls
      # `latest`, which the supply-chain rule rejects.
      - name: Install mcp-publisher
        run: |
          curl -sSL -o mcp-publisher.tar.gz https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  mcp-publisher.tar.gz" | sha256sum -c
          tar xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate packages/proxy/server.json

      # The registry accepts the entry only once npm serves the package at
      # this version with its mcpName, and npm's read path can lag the
      # publish. Poll every 15 s for up to 10 minutes; a failed `npm view`
      # and an empty answer both keep waiting; expiry fails the job.
      - name: Wait for npm to serve the package with its mcpName
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          deadline=$((SECONDS + 600))
          while :; do
            name="$(npm view "@gethelio/proxy@$VERSION" mcpName 2>/dev/null || true)"
            echo "npm view @gethelio/proxy@$VERSION mcpName -> '$name'"
            if [ "$name" = "so.helio/helio" ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::npm did not serve @gethelio/proxy@$VERSION with mcpName so.helio/helio within 10 minutes."
              exit 1
            fi
            sleep 15
          done

      # The private key reaches this step only, through the environment,
      # and never a command line the log would show.
      - name: Log in to the registry
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: ./mcp-publisher login dns --domain helio.so --private-key "$MCP_PRIVATE_KEY"

      - name: Publish server.json
        run: ./mcp-publisher publish packages/proxy/server.json

      - name: Verify the registry serves this version as latest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          curl -sS https://registry.modelcontextprotocol.io/v0.1/servers/so.helio%2Fhelio/versions/latest \
            | jq -e --arg v "$VERSION" '.server.version == $v'

  docker:
    name: Docker Build & Push
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/set-release-version.sh "$VERSION"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gethelio/helio
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Attestations (explicit for documentation): full build provenance
          # and an SBOM of the final stage's filesystem from BuildKit's syft
          # scanner, pinned (stable-1 floats). The SBOM lists the base
          # image's packages too; the check step below asserts that its
          # proxy tree equals the lockfile's. The `sbom` job publishes the
          # CycloneDX documents of both lockfile-pinned trees as release
          # assets.
          provenance: mode=max
          sbom: 'generator=docker/buildkit-syft-scanner:1.12.0'
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Read the SBOM attestations back from the registry, both platforms,
      # the way a consumer does, and assert each lists exactly the proxy's
      # production tree from the lockfile plus the proxy at the tag's
      # version (issue #368). Runs before the signature, so a document that
      # fails is never signed.
      - name: Assert the pushed image's SBOM attestations list the proxy's production tree
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker buildx imagetools inspect "ghcr.io/gethelio/helio@${DIGEST}" \
            --format '{{ json .SBOM }}' > "$RUNNER_TEMP/image-sbom.json"
          scripts/check-image-sbom.sh "$RUNNER_TEMP/image-sbom.json" "$VERSION"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with cosign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        # --recursive signs the multi-arch index AND each per-platform child
        # image, so the amd64/arm64 images users actually pull are each signed.
        run: cosign sign --yes --recursive "ghcr.io/gethelio/helio@${DIGEST}"

  sbom:
    name: Generate SBOM
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set package versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/set-release-version.sh "$VERSION"

      # Production packages only: `pnpm sbom` reads license and author
      # metadata from the store, so the store must hold the production
      # trees of both packages the documents below describe (an
      # unfiltered production install does), and nothing here needs
      # the dev tree or a native build.
      - name: Install production dependencies
        run: pnpm install --frozen-lockfile --prod --ignore-scripts

      # CycloneDX 1.6 of each package's production tree as
      # pnpm-lock.yaml pins it, at the tag's version: the proxy's
      # (sbom.json) and the dashboard bundle's (sbom-dashboard.json).
      # The script fails the job on an empty, mis-scoped, incomplete,
      # or unlicensed inventory (issues #349 and #365).
      - name: Generate and check the SBOMs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/generate-sbom.sh proxy sbom.json "$VERSION"
          scripts/generate-sbom.sh dashboard sbom-dashboard.json "$VERSION"

      # Both documents by name before anything ships: upload-artifact
      # warns on zero matches and says nothing about a partial list,
      # and the release action skips an unmatched path by default.
      - name: Assert both SBOM documents exist
        run: test -f sbom.json && test -f sbom-dashboard.json

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            sbom.json
            sbom-dashboard.json
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [publish-npm, publish-pypi, docker, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download SBOMs
        uses: actions/download-artifact@v4
        with:
          name: sbom

      - name: Assert both SBOM documents were downloaded
        run: test -f sbom.json && test -f sbom-dashboard.json

      - name: Generate changelog
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$TAG_NAME" ]; then
            echo "Initial release of Helio." > changelog.md
          else
            git log --pretty=format:"- %s (%h)" "${PREV_TAG}..${TAG_NAME}" > changelog.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: changelog.md
          files: |
            sbom.json
            sbom-dashboard.json
          # Off by default: an unmatched path is skipped and the release
          # is created with whatever matched.
          fail_on_unmatched_files: true
