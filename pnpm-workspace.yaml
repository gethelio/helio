packages:
  - 'packages/*'

# Transitive security pins, exact per the version-pinning policy in
# DEPENDENCIES.md. A pinned version can itself age into a later advisory, so
# every entry has to move when the audit gate names it (axios in #188,
# fast-uri and postcss in #194).
overrides:
  path-to-regexp: 8.4.2
  axios: 1.18.1
  # fast-uri host confusion and SSRF via IDN canonicalization, IPv6
  # normalization, percent-decoding, scheme handling, port authority
  # injection in serialize(), and IP-literal bracket confusion
  # (GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf,
  # GHSA-jqff-g426-hqxp, all patched 3.1.6; GHSA-qw65-cvwx-89v3 and
  # GHSA-58mr-gqgx-xq4g, patched 3.1.7), on top of the three the 3.1.5
  # pin covered (GHSA-4c8g-83qw-93j6, GHSA-v2hh-gcrm-f6hx,
  # GHSA-7p8r-x3mc-p8w7). Dev-only path through @modelcontextprotocol/sdk
  # and ajv, whose ^3.0.1 already admits the fix; the ranged override
  # carries it and self-retires once natural resolution reaches 3.1.7 or
  # later.
  'fast-uri@<3.1.7': 3.1.7
  follow-redirects: 1.16.0
  # Both brace-expansion advisories at once: GHSA-mh99-v99m-4gvg (patched 1.1.17
  # / 5.0.8) and GHSA-rgw5-rvv9-x895, which bypasses that mitigation (patched
  # 1.1.18 / 5.0.9). The 1.x line has a patch now, so it is no longer an ignore.
  'brace-expansion@<1.1.18': 1.1.18
  'brace-expansion@>=3.0.0 <5.0.9': 5.0.9
  'form-data@>=4.0.0 <4.0.6': 4.0.6
  # nanoid custom-generator infinite loop when size is zero
  # (GHSA-2v37-7h3g-55p8, patched 3.3.18; dev-only paths, postcss via
  # tsup/vite/vitest). postcss's ^3.3.17 admits the fix, but pnpm has no
  # scoped transitive refresh (update is direct-only, dedupe cannot fetch),
  # so the ranged override carries it; the range self-retires once natural
  # resolution reaches 3.3.18.
  'nanoid@<3.3.18': 3.3.18
  # express-rate-limit (via @modelcontextprotocol/sdk) depends on an EXACT
  # ip-address 10.1.0, so no range resolution can reach the fix.
  ip-address: 10.3.1 # GHSA-mwp4-54f8-5fhr
  # browserslist prototype write and uncaught crash via untrusted
  # browserslist-stats.json (GHSA-c83g-rgw3-j3cx, GHSA-73wf-gq98-2v4g,
  # both patched 4.28.7). Every path is a dev-only transitive through
  # @babel/core, whose @babel/helper-compilation-targets declares
  # ^4.24.0, a range that already admits the fix. The lockfile was
  # simply pinned at 4.28.2, and pnpm has no scoped transitive refresh,
  # so the ranged override carries it; the range self-retires once
  # natural resolution reaches 4.28.7 or later.
  'browserslist@<4.28.7': 4.28.8

# pnpm 11 reads settings from this file only; the package.json "pnpm" field
# is ignored. The GHSA below is triaged and tracked (esbuild dev-server: #64).
auditConfig:
  ignoreGhsas:
    # esbuild dev-server file read (low, dev-only): only the 0.27.4 instance
    # (via tsup/bundle-require and tsx) is in range, none of them run the dev
    # server, and tsup's ^0.27.0 / tsx's ~0.27.0 cannot reach 0.28.1; triage
    # record on #64.
    - GHSA-g7r4-m6w7-qqqr

# Native build scripts approved to run at install (pnpm 11 renamed
# onlyBuiltDependencies to allowBuilds).
allowBuilds:
  better-sqlite3: true
  esbuild: true
